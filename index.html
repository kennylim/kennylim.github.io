<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken L. - Data Architect & Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #faf9f7;
            color: #1a1a1a;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header {
            border-bottom: 1px solid #e5e5e5;
            padding: 40px 0;
            margin-bottom: 40px;
        }
        .nav-tabs {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .nav-tabs {
                gap: 20px;
            }
            .nav-tab {
                font-size: 14px;
            }
        }
        .nav-tab {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            text-decoration: none;
            padding: 0;
            transition: color 0.2s ease;
        }
        .nav-tab:hover,
        .nav-tab.active {
            color: #1a1a1a;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 40px 0 20px 0;
            letter-spacing: -0.01em;
        }
        h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
        }
        p {
            margin: 15px 0;
            color: #444;
        }
        .intro {
            font-size: 18px;
            margin: 20px 0 40px 0;
            color: #444;
        }
        .section {
            margin-bottom: 50px;
        }
        .experience-item {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
        }
        .experience-item:last-child {
            border-bottom: none;
        }
        .job-title {
            font-weight: 600;
            color: #1a1a1a;
        }
        .company {
            color: #666;
        }
        ul {
            margin: 15px 0;
            padding-left: 20px;
        }
        li {
            margin: 8px 0;
            color: #444;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .skill-category {
            margin-bottom: 15px;
        }
        .skill-label {
            font-weight: 600;
            color: #1a1a1a;
        }
        .blog-post {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .blog-post:last-child {
            border-bottom: none;
        }
        .blog-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .blog-date {
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
        }
        .blog-excerpt {
            color: #666;
            margin-bottom: 10px;
        }
        .read-more {
            color: #1a1a1a;
            text-decoration: underline;
        }
        .photo-category-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .category-btn {
            background: none;
            border: 1px solid #e5e5e5;
            font-family: inherit;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }
        .category-btn:hover,
        .category-btn.active {
            color: #1a1a1a;
            border-color: #1a1a1a;
        }
        .photo-category {
            display: none;
        }
        .photo-category.active {
            display: block;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 20px 0;
        }
        .photo-item {
            border: 1px solid #e5e5e5;
            padding: 20px;
        }
        .photo-placeholder {
            width: 100%;
            height: 200px;
            background-color: #f5f5f5;
        .photo-placeholder {
            width: 100%;
            height: 200px;
            background-color: #f5f5f5;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 15px;
        }
        .photo-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .footer {
            border-top: 1px solid #e5e5e5;
            padding: 40px 0;
            margin-top: 60px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Ken Lim</h1>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="openTab('home')">Home</button>
            </div>
        </header>

        <!-- Main Content -->
 

</body>
</html>
